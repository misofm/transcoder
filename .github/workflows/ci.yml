name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build
      - run: npm pack --dry-run
      - run: git diff --check

  consumers:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack
      - name: Install in isolated Node consumer
        run: node test/isolated-consumer.mjs node "$(pwd)"/*.tgz
      - name: Install in isolated Bun consumer
        run: bun test/isolated-consumer.mjs bun "$(pwd)"/*.tgz

  pinned-ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/linuxserver/ffmpeg:8.1.2-cli-ls76@sha256:2e7000921be8de2704a4f27dfd3d988562697a346eaabb937a81046c306f0af7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: apt-get update
      - run: apt-get install --yes unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chrome
      - name: Pinned structural and golden conformance
        env:
          MISO_FFMPEG: /usr/local/bin/ffmpeg
          MISO_FFPROBE: /usr/local/bin/ffprobe
          MISO_PINNED_FFMPEG: "1"
          MISO_UPDATE_GOLDEN: "1"
          MISO_HLS_SMOKE: "1"
          MISO_CHROMIUM_PATH: /opt/google/chrome/chrome
        run: bun test test/ffmpeg-integration.test.ts
      - name: Upload generated golden
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linuxserver-ffmpeg-8.1.2-golden
          path: test/fixtures/linuxserver-ffmpeg-8.1.2.golden.json
          retention-days: 1
