name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build
      - run: npm pack --dry-run
      - run: git diff --check

  consumers:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack
      - name: Install in isolated Node consumer
        run: node test/isolated-consumer.mjs node "$(pwd)"/*.tgz
      - name: Install in isolated Bun consumer
        run: bun test/isolated-consumer.mjs bun "$(pwd)"/*.tgz

  pinned-ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Require the immutable issue-pinned archive URL
        env:
          ARCHIVE_URL: ${{ vars.FFMPEG_812_BTBN_URL }}
        run: test -n "$ARCHIVE_URL"
      - name: Fetch immutable reference archive
        env:
          ARCHIVE_URL: ${{ vars.FFMPEG_812_BTBN_URL }}
        run: curl --fail --location --proto '=https' --tlsv1.3 --output /tmp/ffmpeg.tar.xz "$ARCHIVE_URL"
      - name: Verify reference archive
        run: echo 'def57dbadfb868996ffae6e2b0c6f0ebce9b96a3069e8fa86f9e69e0fff78f59  /tmp/ffmpeg.tar.xz' | sha256sum --check --strict
      - run: mkdir /tmp/ffmpeg-reference
      - run: tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-reference --strip-components=1
      - name: Pinned structural and golden conformance
        env:
          MISO_FFMPEG: /tmp/ffmpeg-reference/bin/ffmpeg
          MISO_FFPROBE: /tmp/ffmpeg-reference/bin/ffprobe
          MISO_PINNED_FFMPEG: "1"
          MISO_HLS_SMOKE: "1"
        run: bun test test/ffmpeg-integration.test.ts
